<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243240"/>
      <stop offset="1" stop-color="#10171c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbb8ff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset=".45" stop-color="#b79cff" stop-opacity="0"/>
      <stop offset="1" stop-color="#b79cff" stop-opacity=".55"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <!-- halo de l'onglet piloté -->
  <rect x="17" y="22" width="94" height="76" rx="15" fill="none" stroke="#8b5cf6" stroke-width="10" opacity=".55" filter="url(#glow)"/>
  <!-- fenêtre -->
  <rect x="17" y="22" width="94" height="76" rx="15" fill="#131b21" stroke="url(#frame)" stroke-width="6"/>
  <rect x="28" y="31" width="28" height="7" rx="3.5" fill="#8b5cf6"/>
  <rect x="61" y="31" width="14" height="7" rx="3.5" fill="#8b5cf6" opacity=".4"/>
  <!-- impulsion de clic, comme celle que l'extension affiche sur la page -->
  <circle cx="58" cy="57" r="15" fill="url(#pulse)"/>
  <circle cx="58" cy="57" r="15" fill="none" stroke="#cbb8ff" stroke-width="2.5" opacity=".9"/>
  <!-- curseur de l'agent -->
  <path d="M58 57 L58 105 L70 93.5 L78.5 112 L87.5 108 L79 90 L95 89.5 Z"
        fill="#ffffff" stroke="#10171c" stroke-width="6" stroke-linejoin="round" paint-order="stroke"/>
</svg>
