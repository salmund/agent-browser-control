<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Aperçu panneau</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/extension/sidepanel.css">
</head>
<body>
<script>
// Faux chrome.* pour prévisualiser le panneau hors extension.
// Paramètres : ?off ?refused ?paused ?empty ?ask ?approval[=vault] ?unlock[=login] ?agentpause ?messages ?view=settings|secrets ?light ?w=360
// Coffre : ?bw=login|locked|unlocked|nocli (verrouillé par défaut).
const now = Date.now();
const params = new URLSearchParams(location.search);
if (params.has("w")) document.documentElement.style.maxWidth = params.get("w") + "px";
const listeners = { session: [], local: [] };
const session = {
  connected: !params.has("off") && !params.has("refused"),
  connError: params.has("refused") ? "Le démon accepte une autre installation de l'extension. Pour autoriser celle-ci : npm run unpin-extension, puis Reconnecter." : "",
  paused: params.has("paused"),
  daemonVersion: "0.10.1",
  pausedAgents: params.has("agentpause") ? ["deepcode"] : [],
  activity: params.has("empty") ? [] : [
    { id: 12, t: now - 2500, agent: "claude-code", color: "purple", tool: "wait_for", target: "« Envoyé »", host: "mail.exemple.fr", tabId: 11, summary: "« Envoyé »", status: "running" },
    { id: 11, t: now - 4000, agent: "claude-code", color: "purple", tool: "computer", action: "left_click", target: "bouton « Envoyer »", host: "mail.exemple.fr", tabId: 11, summary: "left_click ref_14", status: "ok", ms: 182 },
    { id: 10, t: now - 6000, agent: "claude-code · recherche-2", color: "cyan", tool: "get_page_text", host: "fr.wikipedia.org", tabId: 13, summary: "", status: "running" },
    { id: 9, t: now - 9000, agent: "claude-code", color: "purple", tool: "read_page", target: "", host: "mail.exemple.fr", tabId: 11, summary: "interactive", status: "ok", ms: 62 },
    { id: 8, t: now - 12000, agent: "claude-code · recherche-2", color: "cyan", tool: "navigate", target: "https://fr.wikipedia.org/wiki/Larynx", host: "fr.wikipedia.org", tabId: 13, summary: "https://fr.wikipedia.org/wiki/Larynx", status: "ok", ms: 1100 },
    { id: 7, t: now - 19000, agent: "deepcode", color: "orange", tool: "navigate", target: "https://mabanque.fr", host: "mabanque.fr", summary: "https://mabanque.fr", status: "error", ms: 3, error: "Le site mabanque.fr est interdit aux agents (liste de blocage : mabanque.fr)." },
    { id: 6, t: now - 26000, agent: "deepcode", color: "orange", tool: "find", target: "« Refuser les cookies »", host: "lemonde.fr", tabId: 21, summary: "\"Refuser les cookies\"", status: "ok", ms: 38 },
    { id: 5, t: now - 41000, agent: "claude-code", color: "purple", tool: "computer", action: "type", target: "", host: "mail.exemple.fr", tabId: 11, summary: "type", status: "ok", ms: 240 },
    { id: 4, t: now - 58000, agent: "claude-code", color: "purple", tool: "browser_script", host: "mail.exemple.fr", summary: "", status: "ok", ms: 11800 },
    { id: 3, t: now - 70000, agent: "claude-code", color: "purple", tool: "tabs_create", target: "https://mail.exemple.fr/", host: "mail.exemple.fr", summary: "https://mail.exemple.fr/", status: "ok", ms: 920 },
    { id: 2, t: now - 90000, agent: "claude-code", color: "purple", tool: "computer", action: "key", target: "ctrl+a Backspace", host: "mail.exemple.fr", summary: "key ctrl+a Backspace", status: "ok", ms: 35 },
    { id: 1, t: now - 120000, agent: "claude-code", color: "purple", tool: "tabs_context", summary: "", status: "ok", ms: 7 },
  ],
  askRequests: params.has("ask") ? [{ id: "ask_1", agent: "claude-code", tabId: 11, question: "Résolvez le captcha puis cliquez « C'est fait ».", context: "La page de connexion de l'université demande une vérification.", url: "https://cas.univ-exemple.fr/login", title: "CAS - Connexion", at: now - 20000, until: now + 280000 }] : [],
  agentMessages: params.has("messages") ? [
    { id: "msg_a", to: "claude-code", text: "Pas Wikipédia anglais : reste sur les sources françaises.", t: now - 300000, deliveredAt: now - 240000, tool: "navigate" },
    { id: "msg_b", to: "claude-code · recherche-2", text: "Garde aussi les références de bas de page.", t: now - 30000 },
  ] : [],
  credApprovals: !params.has("approval") ? [] : params.get("approval") === "vault"
    ? [{ id: 4, agent: "claude-code", slotId: "vaultwarden", label: "2 comptes Vaultwarden", tabHost: "cas.univ-exemple.fr", use: "login", fields: 2, vault: "Vaultwarden",
        candidates: [{ id: "a", name: "SSO université", username: "etu12345" }, { id: "b", name: "SSO université (ancien)", username: "prenom.nom" }], canRemember: true, t: now - 5000, until: now + 70000 }]
    : [{ id: 3, agent: "claude-code", slotId: "sso-univ", label: "SSO université", tabHost: "cas.univ-exemple.fr", t: now - 12000 }],
  bwUnlockRequests: params.has("unlock") ? [{ id: "bwu-1", agent: "claude-code", host: "cas.univ-exemple.fr", vault: "Vaultwarden", needsLogin: params.get("unlock") === "login", t: now - 3000, until: now + 117000 }] : [],
};
let bwState = params.get("bw") ?? "locked";
const local = {
  blocklist: ["mabanque.fr", "1password.com"],
  ...(bwState !== "login" && { bwServer: { serverUrl: "https://vault.exemple.fr", kind: "vaultwarden", version: "2026.6.0", email: "moi@exemple.fr" } }),
  credSlots: { format: "abc-credentials-v1", salt: "AAAA", verifier: { iv: "", data: "" }, slots: {
    "sso-univ": { id: "sso-univ", label: "SSO université", login: "etu12345", hosts: ["univ-exemple.fr"], policy: "ask", iv: "", data: "" },
    "github": { id: "github", label: "GitHub", hosts: ["github.com"], policy: "always", external: { provider: "bitwarden", itemId: "x", itemName: "GitHub perso" } },
  } },
};
const store = (obj, area) => ({
  get: async (keys) => {
    if (keys == null) return { ...obj };
    const list = Array.isArray(keys) ? keys : [keys];
    return Object.fromEntries(list.filter((k) => k in obj).map((k) => [k, obj[k]]));
  },
  set: async (v) => {
    const changes = {};
    for (const [k, val] of Object.entries(v)) changes[k] = { oldValue: obj[k], newValue: val };
    Object.assign(obj, v);
    for (const fn of listeners[area]) fn(changes, area);
  },
  onChanged: { addListener: (fn) => listeners[area].push(fn) },
});
session.groups = { "claude-code": 1, "claude-code · recherche-2": 2, "deepcode": 3 };
const fakeGroups = [
  { id: 1, title: "claude-code", color: "purple", windowId: 1 },
  { id: 2, title: "claude-code · recherche-2", color: "cyan", windowId: 1 },
  { id: 3, title: "deepcode", color: "orange", windowId: 1 },
];
const fakeTabs = { 1: [{ id: 11, active: true, windowId: 1 }, { id: 12, windowId: 1 }, { id: 14, windowId: 1 }], 2: [{ id: 13, windowId: 1 }], 3: [{ id: 21, windowId: 1 }] };
const ev = { addListener() {} };
window.chrome = {
  storage: { session: store(session, "session"), local: store(local, "local") },
  runtime: {
    getManifest: () => ({ version: "0.10.1" }),
    reload: () => console.log("reload"),
    sendMessage: async (m) => {
      console.log("message", m);
      if (m.type === "stop") await chrome.storage.session.set({ paused: true });
      if (m.type === "resume") await chrome.storage.session.set({ paused: false });
      if (m.type === "agent-pause") {
        const set = new Set(session.pausedAgents);
        m.paused ? set.add(m.agent) : set.delete(m.agent);
        await chrome.storage.session.set({ pausedAgents: [...set] });
      }
      if (m.type === "agent-message") {
        await chrome.storage.session.set({ agentMessages: [...session.agentMessages, { id: "msg_" + Date.now(), to: m.to, text: m.text, t: Date.now() }] });
        return { ok: true, result: {} };
      }
      if (m.type === "agent-message-cancel") await chrome.storage.session.set({ agentMessages: session.agentMessages.filter((x) => x.id !== m.id) });
      if (m.type === "activity-clear") await chrome.storage.session.set({ activity: [] });
      if (m.type === "ask-decision") await chrome.storage.session.set({ askRequests: session.askRequests.filter((a) => a.id !== m.id) });
      if (m.type === "credential-decision") await chrome.storage.session.set({ credApprovals: session.credApprovals.filter((a) => a.id !== m.id) });
      if (m.type === "bw-status") {
        if (bwState === "nocli") return { ok: true, result: { cli: false, state: "unknown" } };
        const st = bwState === "login" ? "unauthenticated" : bwState;
        return { ok: true, result: { cli: true, state: st, ...(st !== "unauthenticated" && { email: "moi@exemple.fr", serverUrl: "https://vault.exemple.fr" }) } };
      }
      if (m.type === "bw-probe" || m.type === "bw-configure") {
        await new Promise((r) => setTimeout(r, 300));
        return /passwords\./.test(m.serverUrl)
          ? { ok: true, result: { serverUrl: "https://vault.exemple.fr", kind: "vaultwarden", version: "2026.6.0" } }
          : { ok: false, error: "Serveur injoignable depuis ce PC (fetch failed). Vérifiez l'adresse, et que Tailscale est connecté s'il s'agit d'un serveur privé." };
      }
      if (m.type === "bw-login") {
        if (!m.code) return { ok: false, reason: "needs-code", error: "Connexion en deux étapes : saisissez le code de votre application d'authentification (ou celui reçu par e-mail)." };
        bwState = "unlocked";
        return { ok: true, result: { state: "unlocked", email: m.email } };
      }
      if (m.type === "bw-unlock") {
        if (m.password !== "bon") return { ok: false, error: "Invalid master password." };
        bwState = "unlocked";
        await chrome.storage.session.set({ bwUnlockRequests: [] });
        return { ok: true, result: { state: "unlocked" } };
      }
      if (m.type === "bw-unlock-decline") await chrome.storage.session.set({ bwUnlockRequests: [] });
      if (m.type === "bw-lock") bwState = "locked";
      if (m.type === "bw-logout") bwState = "login";
      if (m.type === "credentials-state") return { ok: true, result: { unlocked: false } };
      if (m.type === "diagnostic") return { ok: true, result: { version: "0.10.1" } };
      return { ok: true };
    },
  },
  commands: { getAll: async () => [{ name: "stop-all", shortcut: "Alt+Shift+S", description: "Tout arrêter" }, { name: "_execute_action", shortcut: "", description: "" }] },
  tabGroups: { get: async (id) => fakeGroups.find((g) => g.id === id), query: async () => fakeGroups, update: async (id, o) => console.log("groupe", id, o), onUpdated: ev, onRemoved: ev },
  tabs: {
    query: async ({ groupId, active }) => (active ? [{ id: 99, url: "https://www.lemonde.fr/", windowId: 1 }] : fakeTabs[groupId] ?? []),
    get: async (id) => ({ id, windowId: 1 }),
    update: async (id, o) => console.log("onglet", id, o),
    remove: async (ids) => console.log("fermer", ids),
    create: async (o) => console.log("créer", o),
    onCreated: ev, onRemoved: ev, onUpdated: ev,
  },
  windows: { update: async (id, o) => console.log("fenêtre", id, o) },
  history: { search: async ({ text }) => (/vaultwarden|passwords/.test(text) ? [{ url: "https://vault.exemple.fr/#/vault", title: "Vaultwarden Web", visitCount: 12 }] : []) },
};
if (params.has("view")) sessionStorage.setItem("abc-view", params.get("view"));
</script>
<div id="mount"></div>
<script>
fetch("/extension/sidepanel.html").then((r) => r.text()).then(async (html) => {
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script, link").forEach((n) => n.remove());
  document.getElementById("mount").replaceWith(...doc.body.childNodes);
  const crypto = document.createElement("script");
  crypto.src = "/extension/slots-crypto.js";
  crypto.onload = () => {
    const s = document.createElement("script");
    s.type = "module";
    s.src = "/extension/panel/main.js";
    document.body.append(s);
  };
  document.body.append(crypto);
});
</script>
</body>
</html>
