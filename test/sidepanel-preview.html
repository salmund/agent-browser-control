<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Aperçu panneau</title>
<link rel="stylesheet" href="/extension/sidepanel.css">
<style>html { max-width: 400px; border-right: 1px dashed #888; min-height: 100vh; }</style>
</head>
<body>
<script>
// Faux chrome.* pour prévisualiser le panneau hors extension.
const now = Date.now();
const params = new URLSearchParams(location.search);
const session = {
  connected: params.get("off") === null,
  paused: params.get("paused") !== null,
  activity: params.get("empty") !== null ? [] : [
    { id: 9, t: now - 1500, agent: "claude-code", color: "purple", tool: "computer", summary: "left_click ref_14", status: "running" },
    { id: 8, t: now - 4000, agent: "claude-code", color: "purple", tool: "read_page", summary: "interactive", status: "ok", ms: 62 },
    { id: 7, t: now - 9000, agent: "deepcode", color: "cyan", tool: "wait_for", summary: "", status: "ok", ms: 8800 },
    { id: 6, t: now - 18000, agent: "deepcode", color: "cyan", tool: "save_image", summary: "ref_21", status: "ok", ms: 310 },
    { id: 5, t: now - 26000, agent: "muse-code", color: "orange", tool: "navigate", summary: "https://mabanque.fr", status: "error", ms: 3, error: "Le site mabanque.fr est interdit aux agents (liste de blocage : mabanque.fr)." },
    { id: 4, t: now - 41000, agent: "muse-code", color: "orange", tool: "find", summary: "\"Refuser les cookies\"", status: "ok", ms: 38 },
    { id: 3, t: now - 58000, agent: "claude-code", color: "purple", tool: "browser_script", summary: "", status: "ok", ms: 11800 },
  ],
};
const local = { blocklist: ["mabanque.fr", "1password.com"] };
const store = (obj) => ({ get: async () => ({ ...obj }), set: async (v) => Object.assign(obj, v), onChanged: { addListener() {} } });
session.groups = { "claude-code": 1, "deepcode": 2, "muse-code": 3 };
const fakeGroups = { 1: { id: 1, color: "purple" }, 2: { id: 2, color: "cyan" }, 3: { id: 3, color: "orange" } };
const fakeTabs = { 1: [{ id: 11, active: true, windowId: 1 }, { id: 12, windowId: 1 }], 2: [{ id: 21, windowId: 1 }], 3: [] };
const ev = { addListener() {} };
window.chrome = {
  storage: { session: store(session), local: store(local) },
  runtime: { sendMessage: async (m) => console.log("message", m) },
  tabGroups: { get: async (id) => fakeGroups[id], query: async () => [], update: async (id, o) => console.log("groupe", id, o), onUpdated: ev, onRemoved: ev },
  tabs: { query: async ({ groupId }) => fakeTabs[groupId] ?? [], update: async (id, o) => console.log("onglet", id, o), onCreated: ev, onRemoved: ev, onUpdated: ev },
  windows: { update: async (id, o) => console.log("fenêtre", id, o) },
};
</script>
<div id="mount"></div>
<script>
fetch("/extension/sidepanel.html").then(r => r.text()).then(html => {
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script, link").forEach(n => n.remove());
  document.getElementById("mount").replaceWith(...doc.body.childNodes);
  const s = document.createElement("script"); s.src = "/extension/sidepanel.js"; document.body.append(s);
});
</script>
</body>
</html>
